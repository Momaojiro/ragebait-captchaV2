<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Check</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="captcha-container">
        <div class="captcha-box" id="initial-captcha">
            <div class="checkbox-container">
                <input type="checkbox" id="robot-check">
                <div class="custom-checkbox" id="custom-checkbox">
                    <!-- SVG Checkmark -->
                    <svg class="checkmark" viewBox="0 0 24 24">
                        <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>
                    </svg>
                </div>
                <label for="robot-check">I am not a robot</label>
            </div>
            <div class="logo-area">
                <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' width='24' height='24'><path fill='%234285f4' d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15h-2v-2h2v2zm0-4h-2V7h2v6z'/></svg>" alt="logo" class="captcha-logo">
                <div class="captcha-text">reCAPTCHA<br>Privacy - Terms</div>
            </div>
        </div>
    </div>

    <!-- Modal for puzzles -->
    <div class="modal-overlay" id="puzzle-modal">
        <div class="modal-arrow"></div>
        <div class="modal-content" id="modal-content">
            <!-- Content will be injected here -->
        </div>
    </div>

    <!-- Jumpscare container -->
    <div id="jumpscare-container" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999; background: black;">
        <img src="jumpscare.png" style="width: 100%; height: 100%; object-fit: cover;" alt="Jumpscare Image Missing" onerror="this.alt='Please save the image as jumpscare.png in the folder!'; this.style.color='white'; this.style.fontSize='24px'; this.style.padding='20px';">
    </div>

    <!-- Preload the audio file -->
    <audio id="jumpscare-audio" src="nam_ewwww.wav" preload="auto"></audio>

    <script src="script.js"></script>
</body>
</html>
